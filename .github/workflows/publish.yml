name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag (for example v1.2.3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Select the default branch.' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag or release already exists.' >&2
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            printf '## Commits since %s\n\n' "$previous" > release-notes.md
            git log --format='- %h %s' "$previous..HEAD" >> release-notes.md
          else
            printf '## Commits\n\n' > release-notes.md
            git log --format='- %h %s' HEAD >> release-notes.md
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --draft --notes-file release-notes.md
